name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, feature/homework_35.2 ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Flake8
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

  # Тесты
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          pip install poetry==1.8.3
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install

      - name: Run migrations
        run: |
          poetry run python manage.py makemigrations users
          poetry run python manage.py migrate users
          poetry run python manage.py migrate
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          SECRET_KEY: test-secret-key-12345
          DEBUG: '1'

      - name: Run tests
        run: poetry run python manage.py test --noinput
        env:
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_HOST: localhost
          SECRET_KEY: test-secret-key-12345
          DEBUG: '1'
          TELEGRAM_BOT_TOKEN: fake-token-for-ci-12345

  # Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/homework_35.2')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/habit-tracker:latest
            ${{ secrets.DOCKER_USERNAME }}/habit-tracker:${{ github.sha }}

  # Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/homework_35.2'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/habit-tracker

            cat > .env << EOF
            DEBUG=False
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALLOWED_HOSTS=${{ secrets.SERVER_HOST }}
            TIME_ZONE=Europe/Moscow
            LANGUAGE_CODE=ru-ru
            DB_NAME=habit_tracker
            DB_USER=habit_user
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=db
            DB_PORT=5432
            REDIS_URL=redis://redis:6379/0
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            PAGE_SIZE=5
            EOF

            docker pull ${{ secrets.DOCKER_USERNAME }}/habit-tracker:latest

            # Создаем docker-compose.yml на сервере
            cat > docker-compose.yml << 'EOF'
            version: '3.8'
            services:
              db:
                image: postgres:15-alpine
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                env_file:
                  - .env
                restart: unless-stopped
              redis:
                image: redis:7-alpine
                volumes:
                  - redis_data:/data
                restart: unless-stopped
              web:
                image: ${{ secrets.DOCKER_USERNAME }}/habit-tracker:latest
                ports:
                  - "8000:8000"
                env_file:
                  - .env
                depends_on:
                  - db
                  - redis
                restart: unless-stopped
            volumes:
              postgres_data:
              redis_data:
            EOF

            docker-compose down
            docker-compose up -d

            sleep 15
            docker-compose exec -T web python manage.py migrate --noinput
            docker-compose exec -T web python manage.py collectstatic --noinput

            docker system prune -f