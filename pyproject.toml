[tool.poetry]
name = "habit-tracker"
version = "1.0.0"
description = "API для трекера привычек на основе книги Атомные привычки"
authors = ["Aleksey Lozhkin <aleksey.s.lozhkin@gmail.com>"]
readme = "README.md"
packages = [{include = "config"}, {include = "users"}, {include = "habits"}, {include = "telegram"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
django = "^4.2.0"
djangorestframework = "^3.14.0"
psycopg2-binary = "^2.9.0"
python-dotenv = "^1.0.0"
pillow = "^10.0.0"
django-filter = "^24.0"
djangorestframework-simplejwt = "^5.3.0"
drf-spectacular = "^0.27.0"
celery = "^5.3.0"
redis = "^5.0.0"
django-celery-beat = "^2.5.0"
requests = "^2.31.0"
django-cors-headers = "^4.3.0"
gunicorn = "^21.0.0"
drf-yasg = "^1.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^5.0.0"
coverage = "^7.4.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.0.0"
mypy = "^1.8.0"
black = "^24.0.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Инструменты
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = "venv/|.venv/|build/|dist/|.mypy_cache/|tests*/"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.black]
line-length = 119
skip-string-normalization = true
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [".venv", "venv"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=. --cov-report=html --cov-report=term --cov-fail-under=70"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
DJANGO_SETTINGS_MODULE = "config.settings.test"